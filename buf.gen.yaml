# Python code generation for the v1 API (server; M1c).
#
# TypeScript for the frontend is generated separately by frontend/buf.gen.yaml
# (`pnpm --dir frontend gen`).
#
# Toolchain (install once):
#   protoc                     -> REQUIRED: `protoc_builtin: python` shells out to the
#                                 real `protoc` (buf does not bundle per-language code
#                                 generators). macOS: `brew install protobuf`;
#                                 Debian/Ubuntu: `apt-get install protobuf-compiler`.
#   protoc-gen-connect-python  -> Connect Python plugin (from the dev deps)
#
# Run from the repo root:
#   make proto            # buf generate proto with .venv/bin on PATH
#
# Output lands at `src/originweave/v1/` (importable as `originweave.v1.*`). The
# proto file path (`originweave/v1/originweave.proto`) determines the generated
# module path, and `protoc-gen-connect-python` hardcodes
# `import originweave.v1.originweave_pb2`; so the generated tree must sit under a
# `sys.path` root. Our src layout puts `src/` on the path and the package is
# already named `originweave`, hence `out: src`.
#
# Generated code is a build artifact: not committed, excluded from ruff/mypy
# (see pyproject.toml) and from git (see .gitignore).

version: v2

inputs:
  - directory: proto

plugins:
  - protoc_builtin: python
    out: src
  - local: protoc-gen-connect-python
    out: src
