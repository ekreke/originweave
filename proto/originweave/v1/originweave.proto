// originweave v1 API contract.
//
// Source of truth for field names and semantics:
//   docs/overview/product-overview.md §4   (domain model)
//   docs/overview/blackboard-protocol.md   (board elements, event protocol)
//   docs/overview/dashboard.md §4          (proto service contract)
//
// Field names are snake_case; the default proto3 JSON name is lowerCamelCase,
// which matches the frozen JSON field names (e.g. source_title -> sourceTitle).
// String fields whose value set is frozen are documented inline and MUST keep
// the exact literals listed in the docs.

syntax = "proto3";

package originweave.v1;

import "google/protobuf/struct.proto";

// ---------------------------------------------------------------- common

message Vec2 {
  double x = 1;
  double y = 2;
}

message Evidence {
  string id = 1;
  string quote = 2; // verbatim quote from the source
  string source_title = 3;
  string url = 4;
  string locator = 5;
}

message Edge {
  string id = 1;
  string source = 2; // Fact / Intent id
  string target = 3;
  // main-chain | dependency | goal-derived | decomposes | spawns | resolves
  string relation = 4;
  string note = 5;
}

// ---------------------------------------------------------------- project / run

message Project {
  string id = 1;
  string name = 2;
  string description = 3;
  int32 run_count = 4;
  string updated_at = 5;
  string accent = 6;
}

message IntentCounts {
  int32 open = 1;
  int32 done = 2;
}

message Steps {
  int32 current = 1;
  int32 total = 2;
}

message Budget {
  int64 tokens = 1;
  double cost = 2;
  string elapsed = 3;
}

message Run {
  string id = 1; // "run_009"
  string project_id = 2;
  string title = 3;
  string source_type = 4; // url | text
  string analysis = 5;    // provenance | relation | both
  // queued | running | awaiting_human | paused | stopped | completed | failed
  string status = 6;
  string goal = 7;
  int32 facts = 8;
  int32 deviations = 9;
  int32 entities = 10;
  int32 relations = 11;
  IntentCounts intents = 12;
  double confidence = 13;
  Steps steps = 14;
  Budget budget = 15;
  string created_at = 16;
  string updated_at = 17;
  // Terminal reason for status=stopped|failed (the last STOPPED/FAILED event's
  // `reason`); empty while queued/running/awaiting_human/paused/completed.
  string status_reason = 18;
}

// ---------------------------------------------------------------- board elements

message Fact {
  string id = 1;
  string label = 2;
  string subtitle = 3;
  // origin | goal | fact | citation | source | boundary | compare | deviation
  string kind = 4;
  string role = 5;   // main-claim | sub-claim | none
  string status = 6; // verified | open | flagged | review
  double confidence = 7;
  string note = 8;
  Vec2 position = 9;
  repeated Evidence evidence = 10;
}

message Intent {
  string id = 1;
  // decompose | explore | verify | extract | relate
  string type = 2;
  // open | claimed | done | dropped | awaiting_human
  string status = 3;
  string from = 4; // source Fact id, or "origin"
  string question = 5;
  repeated string produced_facts = 6;
  optional string claimed_by = 7;
  optional string heartbeat_at = 8;
  string created_at = 9;
  // status=dropped: the existing Intent id this one duplicates (set by Validate)
  optional string duplicate_of = 10;
}

message Hint {
  string id = 1;
  string text = 2;
  string author = 3; // human | agent
  string created_at = 4;
}

message WaitingFor {
  string gate = 1;
  string question = 2;
}

message HumanDecision {
  string gate = 1;
  string decision = 2;
  string text = 3;
  repeated string targets = 4;
  string author = 5; // human
  string at = 6;
}

message Entity {
  string id = 1;
  string name = 2;
  // person | organization | product | location | event | other
  string type = 3;
  repeated string aliases = 4;
  string status = 5; // verified | open | flagged
  double confidence = 6;
  string note = 7;
  Vec2 position = 8;
  repeated Evidence evidence = 9;
}

message Relation {
  string id = 1;
  string source = 2; // Entity id
  string target = 3; // Entity id
  string type = 4;   // relation ontology, see product-overview.md §4
  string label = 5;
  string status = 6; // verified | inferred | open | flagged
  double confidence = 7;
  bool inferred = 8;
  string note = 9;
  repeated Evidence evidence = 10;
}

message EntityGraph {
  repeated Entity entities = 1;
  repeated Relation relations = 2;
}

message Deviation {
  string id = 1;
  string title = 2;
  string summary = 3;
  string severity = 4; // high | medium | low
  double confidence = 5;
  string node_id = 6;
}

message Report {
  string run_id = 1;
  string verdict = 2;
  string summary = 3;
  repeated Deviation findings = 4;
  repeated Evidence sources = 5;
}

// ---------------------------------------------------------------- worker session (M6)

message SessionStep {
  int32 seq = 1;
  // turn-start | tool-call | tool-result | message | turn-end
  string kind = 2;
  string name = 3;
  string text = 4;
  optional bool ok = 5;
}

message Session {
  string id = 1;
  string run_id = 2;
  string worker = 3;
  string task = 4; // Bootstrap | Reason | Explore | Validate
  optional string intent_id = 5;
  string model = 6;
  google.protobuf.Struct input = 7; // raw rendered input (prompt / board)
  string output = 8;                // raw reply text
  repeated SessionStep steps = 9;
  string started_at = 10;
  string ended_at = 11;
}

// ---------------------------------------------------------------- settings (M6)

message WorkerBudget {
  int32 max_steps = 1;
  string max_wall = 2; // duration string, e.g. "10m"
  double max_cost = 3; // USD
}

message LlmSettings {
  string provider = 1; // openai (the only compatible provider)
  string model = 2;
  string base_url = 3; // empty means "use the OPENAI_BASE_URL environment variable"
}

message WorkerSettings {
  LlmSettings llm = 1;
  string provider = 2; // local | pi
  int32 max_concurrency = 3;
  repeated string tools = 4; // flat allowlist, matches [worker].tools
  string heartbeat_interval = 5;   // e.g. "15s"
  string heartbeat_timeout = 6;    // must be > heartbeat_interval
  string heartbeat_on_timeout = 7; // release | fail
  WorkerBudget budget = 8;
  string execution = 9; // in-process | container
  string image = 10; // runtime image when execution=container
  string container_scope = 11; // per-call | per-run (Pi + container only)
}

message Settings {
  WorkerSettings worker = 1;
}

// ---------------------------------------------------------------- events

message Event {
  string id = 1;
  string at = 2;
  // PROJECT | INTENT | EXECUTE | CONCLUDE | REASON | COMPLETE | HEARTBEAT |
  // RELEASE | HINT | REQUEST_HUMAN | HUMAN_INPUT | FAILED | STOPPED |
  // PAUSED | RESUMED |
  // VALIDATE | SESSION | WORKER_STEP | ENTITY | RELATION
  string type = 3;
  string message = 4;
  string tone = 5; // info | success | warning | danger
  // Per-type payload. Field names inside Struct MUST use the lowerCamelCase JSON
  // names from blackboard-protocol.md §5 (e.g. sourceTitle, producedFacts).
  google.protobuf.Struct payload = 6;
}

// ---------------------------------------------------------------- run graph (light)

// A Fact stripped to its graph-facing fields: no `note`, no `evidence[]` (the
// verbatim quotes stay behind `GetFactDetail`); `evidence_count` keeps the badge.
message FactSummary {
  string id = 1;
  string label = 2;
  string subtitle = 3;
  // Same value set as Fact.kind.
  string kind = 4;
  string role = 5;   // main-claim | sub-claim | none
  string status = 6; // verified | open | flagged | review
  double confidence = 7;
  Vec2 position = 8;
  int32 evidence_count = 9;
}

// The graph projection polled by the console: board elements + Gate state +
// `event_count` (the full-log length, so the Replay cursor stays stable while
// stepping). Deliberately excludes events[], sessions[], report/deviations and
// source_text -- those live behind GetRun / ListEvents / ListSessions.
message RunGraph {
  Run run = 1;
  FactSummary origin = 2;
  FactSummary goal = 3;
  repeated FactSummary facts = 4;
  repeated Intent intents = 5;
  repeated Edge edges = 6;
  repeated Hint hints = 7;
  optional WaitingFor waiting_for = 8;
  int32 event_count = 9;
}

message GetRunGraphRequest {
  string run_id = 1;
  // Fold only the first `at_event` events (Replay); same semantics as
  // GetRunRequest.at_event.
  optional int32 at_event = 2;
}

message GetRunGraphResponse {
  RunGraph graph = 1;
}

message GetFactDetailRequest {
  string run_id = 1;
  string fact_id = 2; // a facts[] id, or "origin" / "goal"
  optional int32 at_event = 3;
}

message GetFactDetailResponse {
  Fact fact = 1;
}

message ListEventsRequest {
  string run_id = 1;
  // Return only the first `at_event` events (Replay slice); absent = full log.
  optional int32 at_event = 2;
}

message ListEventsResponse {
  repeated Event events = 1;
}

message ListSessionsRequest {
  string run_id = 1;
  // When set, only the sessions of this Intent; absent = every session.
  optional string intent_id = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

// ---------------------------------------------------------------- run detail

message RunDetail {
  Run run = 1;
  Fact origin = 2;
  Fact goal = 3;
  repeated Fact facts = 4;
  repeated Intent intents = 5;
  repeated Hint hints = 6;
  repeated Edge edges = 7;
  optional EntityGraph entity_graph = 8;
  repeated Deviation deviations = 9;
  repeated Event events = 10;
  optional WaitingFor waiting_for = 11;
  optional Report report = 12;
  repeated HumanDecision decisions = 13;
  repeated Session sessions = 14;
  // Document A text (input/document.md), for the "retry" flow; empty when absent.
  string source_text = 15;
}

// ---------------------------------------------------------------- service

service OriginweaveService {
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc ListProjectRuns(ListProjectRunsRequest) returns (ListProjectRunsResponse);
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  rpc GetRun(GetRunRequest) returns (GetRunResponse);
  rpc GetRunGraph(GetRunGraphRequest) returns (GetRunGraphResponse);
  rpc GetFactDetail(GetFactDetailRequest) returns (GetFactDetailResponse);
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc CreateRun(CreateRunRequest) returns (CreateRunResponse);
  rpc AddHint(AddHintRequest) returns (AddHintResponse);
  rpc SubmitHumanInput(SubmitHumanInputRequest) returns (SubmitHumanInputResponse);
  rpc PauseRun(PauseRunRequest) returns (PauseRunResponse);
  rpc ResumeRun(ResumeRunRequest) returns (ResumeRunResponse);
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
}

message ListProjectsRequest {}

message ListProjectsResponse {
  repeated Project projects = 1;
}

message GetProjectRequest {
  string project_id = 1;
}

message GetProjectResponse {
  Project project = 1;
}

message CreateProjectRequest {
  string id = 1; // [A-Za-z0-9][A-Za-z0-9._-]*
  string name = 2;
  optional string description = 3;
  optional string accent = 4; // display accent colour
}

message CreateProjectResponse {
  Project project = 1;
}

message ListProjectRunsRequest {
  string project_id = 1;
}

message ListProjectRunsResponse {
  repeated Run runs = 1;
}

message ListRunsRequest {
  optional string project_id = 1;
}

message ListRunsResponse {
  repeated Run runs = 1;
}

message GetRunRequest {
  string run_id = 1;
  // Replay: fold only the first `at_event` events (1..len) so the returned board
  // reflects the run as of that step. Unset = the full board. `events[]` is always
  // returned in full so the timeline length stays stable while stepping.
  optional int32 at_event = 2;
}

message GetRunResponse {
  RunDetail run_detail = 1;
}

message CreateRunRequest {
  string project_id = 1;
  optional string title = 2;
  string source_type = 3; // url | text
  optional string analysis = 4; // provenance | relation | both (default provenance)
  string goal = 5;
  // Budget overrides; unset fields fall back to the [worker.budget] config.
  optional int32 max_steps = 6;
  optional string max_wall = 7; // duration string, e.g. "10m"
  optional double max_cost = 8; // USD
  optional bool auto = 9; // true = skip HITL gates
  // Document A text; provided when source_type = "text". "url" is not yet supported.
  optional string source_text = 10;
}

message CreateRunResponse {
  Run run = 1;
}

message AddHintRequest {
  string run_id = 1;
  string text = 2; // author is fixed to "human"
}

message AddHintResponse {
  Hint hint = 1;
}

message SubmitHumanInputRequest {
  string run_id = 1;
  string gate = 2;     // confirm-claim | arbitrate | review
  string decision = 3; // approve | edit | reject
  optional string text = 4;
  repeated string targets = 5;
}

message SubmitHumanInputResponse {
  Run run = 1;
}

message PauseRunRequest {
  string run_id = 1;
}

message PauseRunResponse {
  Run run = 1;
}

message ResumeRunRequest {
  string run_id = 1;
}

message ResumeRunResponse {
  Run run = 1;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  Settings settings = 1;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

message SearchRequest {
  string query = 1;
  optional int32 num_results = 2;
}

message SearchResponse {
  string text = 1;
}
