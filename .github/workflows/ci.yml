name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen || uv sync

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.70.0"

      - name: Generate Python proto/Connect code
        run: make proto

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Typecheck
        run: uv run mypy src

      - name: Test
        run: uv run pytest

      - name: Smoke (fake worker, in-process)
        run: make smoke

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.70.0"

      - name: Lint proto
        run: buf lint proto

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.70.0"

      - name: Install
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Generate proto types
        run: pnpm --dir frontend gen

      - name: Typecheck
        run: pnpm --dir frontend typecheck

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Format check
        run: pnpm --dir frontend format:check

      - name: Test
        run: pnpm --dir frontend test

      - name: Build
        run: pnpm --dir frontend build
